PACKAGE_NAME="@_PKGBASE@"
PACKAGE_VERSION="@PKGVER@"
AUTOINSTALL="yes"
CLEAN="make clean"

# DevOS: build ONLY applespi (SPI keyboard + trackpad). The bundled
# apple-ibridge / apple-ib-tb / apple-ib-als modules are provided by the
# maintained split-out apple-ib-drv-dkms-git (apple-ibridge.ko +
# apple-touchbar.ko) — building them here both fails on kernel >=6.11 and
# collides with apple-ib-drv on apple-ibridge.ko. See PKGBUILD prepare().
BUILT_MODULE_NAME[0]="applespi"
MAKE[0]="make KDIR=/usr/lib/modules/$kernelver/build"
DEST_MODULE_LOCATION[0]="/kernel/drivers/spi"
