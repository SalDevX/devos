# EARLY KMS: force i915 so the Intel framebuffer is up BEFORE Plymouth starts at
# boot. The `kms` hook alone loads GPU drivers lazily via udev, which on a real Mac
# lands AFTER Plymouth's boot-splash window → black at boot (the splash only showed
# at shutdown, once i915 was fully up). Force-loading i915 fixes that. The kms hook
# still bundles every other DRM driver (amdgpu/radeon/nouveau/vmwgfx/vboxvideo), so
# VMs and non-Intel hardware still get a framebuffer; i915 simply no-ops where absent.
MODULES=(i915)
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)

# The `plymouth` hook bundles the theme files (devos.script + PNGs) but NOT the
# `script` renderer that a ModuleName=script theme needs — /usr/lib/plymouth/script.so
# exists on the system yet is not pulled into the initramfs, so the devos theme loads
# with no engine and renders a black screen (a stock module theme like spinner works
# because its two-step.so IS bundled). Force the script renderer in; ldd deps resolved.
BINARIES=(/usr/lib/plymouth/script.so)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
