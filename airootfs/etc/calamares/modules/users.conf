# Calamares 3.3+ reads the login shell from the `user:` submap (users module
# Config.cpp: getSubMap(configurationMap, "user") -> "shell"); the old top-level
# `userShell:` key is silently IGNORED and the module falls back to /bin/bash —
# proven by the session.log (`useradd -m -U -s /bin/bash`). DevOS is a zsh
# system: every skel dotfile (.zshenv PATH, .zprofile, .zshrc, p10k) assumes
# zsh, so a bash login shell strands the installed user without them.
user:
    shell: /usr/bin/zsh

defaultGroups:
    - name: wheel
      must_exist: false
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: input
      must_exist: false
      system: true
    - name: render
      must_exist: false
      system: true

autologinGroup:     autologin
doAutologin:        false
sudoersGroup:       wheel
setRootPassword:    false
doReusePassword:    true
passwordRequirements:
    minLength: 6
    maxLength: -1
    libpwquality:
        - minlen=6

avatarFilePath:     .face
permitWeakPasswords: false
