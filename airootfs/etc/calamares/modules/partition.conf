efiSystemPartition:       "/boot"
efiSystemPartitionSize:   "512MiB"
efiSystemPartitionName:   "EFI"
userSwapChoices:
    - none
    - small
    - suspend
    - file
drawNestedPartitions:     false
alwaysShowPartitionLabels: true
defaultFileSystemType:    "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

initialPartitioningChoice: erase
initialSwapChoice:         none

# GPT explicitly (was unset → "will use gpt for efi" warning; DevOS targets are
# always EFI Macs, so pin it and keep manual-mode table creation deterministic).
defaultPartitionTableType: gpt

# LUKS2 for encrypted installs (was unset → Calamares warned and fell back to
# legacy luks1). Safe here: /boot is an unencrypted ESP read by systemd-boot, and
# unlocking is done by the initramfs `encrypt` hook via cryptsetup, which has
# defaulted to LUKS2 since 2.1 — the luks1 fallback exists only for GRUB setups
# that read an encrypted /boot, which DevOS does not do.
luksGeneration: luks2

# Automated layout for EVERY orchestrated mode (Erase, Replace, Resize/Alongside):
# the user picks where/how much space DevOS gets, Calamares materializes
# ESP (from efiSystemPartition* above, prepended automatically) + root + home
# into that space — matching the documented golden layout (ESP /boot · root ext4
# · home ext4 · swapfile; swap is appended only if the user picks a swap choice,
# and "file" needs no partition). Without this key the autopartition made ONE
# big root and no /home. `type` GUIDs are the systemd discoverable-partition
# types for x86-64 root and home. Sizes: root 25% of the target space, clamped
# 20G (= welcome.conf requiredStorage) … 120G; home takes the remainder.
# Encrypted installs: BOTH partitions get LUKS2; root unlocks at the initramfs
# `encrypt` prompt, home via crypttab → systemd asks the same passphrase a
# second time during boot (visible through Plymouth — annoying, not broken).
# Follow-up tracked in memory: auto-unlock home with a keyfile stored in the
# encrypted root (/etc/cryptsetup-keys.d) so one passphrase unlocks everything.
partitionLayout:
    - name: "root"
      type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
      filesystem: "ext4"
      mountPoint: "/"
      size: 25%
      minSize: 20G
      maxSize: 120G
    - name: "home"
      type: "933ac7e1-2eb4-4f13-b844-0e14e2aef915"
      filesystem: "ext4"
      mountPoint: "/home"
      size: 100%
