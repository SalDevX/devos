efiBootLoader:       "systemd-boot"
kernelSearchOrder:   [ "esp", "boot", "bios" ]
installPath:         "/boot"
dataPartition:       false

# Match the curated cmdline the CLI installer writes. The bootloader module
# auto-appends `splash` (plymouth is installed), `rw`, and `root=`/`cryptdevice=`,
# so list only the extras here.
kernelParams:        [ "quiet", "loglevel=3", "vt.global_cursor_default=0" ]

# Without loaderEntries, create_loader() writes only `default <machine-id>*` —
# i.e. no timeout, so systemd-boot shows no menu and the fallback entry is
# unreachable. Mirror the CLI loader.conf settings.
loaderEntries:
  - "timeout 3"
  - "console-mode max"
  - "editor no"
