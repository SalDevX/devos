showSupportUrl:        true
showKnownIssuesUrl:    true
showReleaseNotesUrl:   false
showDonateUrl:         false

# GeneralRequirements schema (Calamares 3.3+): `check` = what to test, `required`
# = which of those must PASS to proceed, `requiredStorage`/`requiredRam` in GiB,
# `internetCheckUrl` for the connectivity probe. The previous block used the
# wrong key names (mandatory/storageGB/ramGB/internetURL) — Calamares logged
# "entry 'check' is incomplete / requiredStorage is missing", never ran a single
# check, and (critically) never set globalStorage["requiredStorageGiB"], which
# the partition module reads in canBeReplaced()/canBeResized() — so the Replace
# and Resize/Alongside actions were silently disabled on the choice page.
#
# `internet` is checked (welcome page shows it) but NOT required: DevOS installs
# fully offline (copyairootfs rsyncs the live squashfs; the devosnetwork page is
# skippable by design). Requiring it would contradict that.
requirements:
    requiredStorage:  20
    requiredRam:      2.0
    internetCheckUrl: https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root
