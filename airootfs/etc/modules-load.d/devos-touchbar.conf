# T1 Touch Bar (2016/2017 MacBook Pro) — DevOS driver auto-load.
#
# The Apple T1 iBridge presents the Touch Bar as USB HID interfaces (05ac:8600).
# DevOS ships the patched apple-ib-drv-f13 DKMS driver (apple-ibridge + apple-ib-tb +
# apple-ib-als) — see aur-build-list.txt. Loading apple-ibridge early lets it claim the
# iBridge HID interfaces; devos-touchbar-init.service (fired by 60-devos-touchbar.rules
# when the iBridge appears) then forces BOTH HID interfaces onto apple-ibridge-hid —
# hid-sensor-hub otherwise steals the 2nd one, which keeps the Touch Bar display DARK —
# and masks usbmuxd. VERIFIED end-to-end on MacBookPro14,3, kernel 6.18.34. The modules
# no-op on non-iBridge hardware (nothing to bind), so this is safe on every Mac.
#
# (The OLD apple-ib-drv panicked kernel >=6.18, which is why this was disabled
# 2026-06-05; the F13 fork + 2 DevOS patches fixed it — 2026-06-06.)
apple-ibridge
apple-ib-tb
apple-ib-als
