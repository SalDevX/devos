# DevOS SDDM configuration — LIVE ISO.
# The installer (devoscleanup / install.sh) rewrites this on the installed system
# to drop the [Autologin] section, so installed machines show the greeter.
[Theme]
Current=devos

[General]
# DevOS XFCE is X11 (picom, libinput-gestures). Keep the greeter on X too.
DisplayServer=x11

[Autologin]
# Live ISO: log the demo user straight into XFCE (try-before-install), no greeter.
User=user
Session=xfce.desktop
Relogin=false
