# DevOS SDDM configuration.
# Shipped in the squashfs (so it rsyncs to the target) but SDDM is enabled ONLY
# on the installed system by the Calamares installer — the live ISO never runs a
# display manager. The installed system shows the DevOS greeter (no autologin).
[Theme]
Current=devos
# Per-user login avatars. The greeter (Main.qml) renders userModel.icon as a
# circular avatar with an initial-letter fallback when a user has none. SDDM
# resolves each user's icon from <FacesDir>/<username>.face.icon; the
# devos-sddm-avatar-sync session helper publishes ~/.face (where Mugshot and the
# Calamares user setup store it) into this wheel-writable, world-readable dir so
# the unprivileged sddm greeter can read it without polkit/sudo.
EnableAvatars=true
FacesDir=/var/lib/devos/faces

[General]
# DevOS XFCE is X11 (picom, libinput-gestures). Keep the greeter on X too.
DisplayServer=x11
