# FaceTime HD webcam V4L2 controls — enforced by cam-tune, edited by cam-control.
# These defaults tame the camera's oversaturated, slightly-dark look on the
# 2013/2014 MacBook; adjust live with the "Camera Controls" app (cam-control).
brightness=119
contrast=103
saturation=68
hue=128
white_balance_automatic=1
