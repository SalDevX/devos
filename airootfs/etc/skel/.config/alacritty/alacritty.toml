# ~/.config/alacritty/alacritty.toml
# Focused readability theme — tuned for learning logs and shell comprehension
# for DevOS

[window]
opacity = 8.0
padding.x = 16
padding.y = 14
decorations = "None"
dynamic_padding = true

[scrolling]
history = 100000  # keep large history for reading logs
multiplier = 3    # faster scroll per wheel notch

# === Theme ===
# Colors live in ~/.config/alacritty/themes/*.toml.
# Switch theme by changing the filename below: mocha | macchiato | frappe | latte
[general]
import = ["~/.config/alacritty/themes/mocha.toml"]

[font]
# Only the normal family is set; Alacritty auto-derives bold / italic /
# bold-italic from it (equivalent to kitty's bold_font/italic_font auto).
normal = { family = "Menlo" }

# Comfortable size for reading + small extra spacing for clarity
size = 10.5
offset = { x = 0, y = 2 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[selection]
save_to_clipboard = true

[cursor]
# "Always" forces blinking even when zsh/tmux request a steady cursor.
style = { shape = "Underline", blinking = "Always" }
blink_interval = 500    # ms per blink (lower = faster)
blink_timeout = 0       # 0 = never stop blinking (default 5s stops when idle)
unfocused_hollow = true

[hints]
[[hints.enabled]]
hyperlinks = true
persist = false
post_processing = true
action = "Copy"
command = "xdg-open"
binding = { key = "O", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Control" }
regex = "(http://|https://|ftp://|mailto:)[^\\s<>\"'`]+"

[terminal.shell]
program = "/usr/bin/zsh"
args = ["-c", "tmux"]

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"



