# Broadcom Mac Wi-Fi — blacklist the legacy softmac stack that would otherwise
# grab the card before the right fullmac driver loads.
#
# brcmfmac is deliberately NOT blacklisted here: devos-wifi-driver.service picks
# wl (BCM4360, 2013-2015) or brcmfmac (BCM4364 2016/2017, BCM4377 T2) per machine
# by Wi-Fi PCI id and blacklists the loser in /etc/modprobe.d/devos-wifi.conf.
# Do NOT re-add `blacklist brcmfmac` — it would kill Wi-Fi on 2016+ MacBooks.
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcm43xx
blacklist brcm80211
blacklist brcmsmac
blacklist bcma
