# i915 kernel module options — MacBookPro11,1 (Haswell ULT, PCI 0a2e).
#
# DO NOT re-enable PSR or FBC on this hardware. The kernel flags both as
# "dangerous" (dmesg: "Setting dangerous option enable_psr/enable_fbc -
# tainting kernel"), and on this Haswell panel they blank the display during
# early KMS — the Plymouth boot splash renders BLACK even though plymouthd is
# running and the theme/initramfs are correct. DC states (enable_dc) need DMC
# firmware that Haswell (gen7.5) lacks, so that option was a no-op here.
# Leaving i915 at its safe defaults is what fixes the black boot splash.
#
# Removed (caused black Plymouth on MacBookPro11,1):
#   options i915 enable_psr=1 enable_dc=2 enable_fbc=1
