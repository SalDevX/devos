# DevOS — capability-keyed BCM43602 Wi-Fi fix (2016/2017 MacBook Pro).
#
# The BCM43602 (Broadcom 14e4:43ba) firmware's WPA 4-way-handshake offload is
# broken (kernel bug 202521): the card associates but the handshake times out, so
# it can't join any WPA network. The fix is brcmfmac `feature_disable=0x82000`.
# It must apply ONLY to the 43602 — 2013-2015 MacBook chips work without it (and a
# blanket option would risk regressing them). So load brcmfmac through a wrapper
# that detects a 43602 at load time and adds the option only when one is present.
# See /usr/local/bin/devos-brcmfmac-load.
install brcmfmac /usr/local/bin/devos-brcmfmac-load
