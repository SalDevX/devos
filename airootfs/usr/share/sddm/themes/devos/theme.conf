[General]
# Per-machine login wallpaper. The greeter runs as the unprivileged `sddm` user
# and can't read /home, so it reads its background from this wheel-writable,
# world-readable file. The XFCE session (devos-sddm-wallpaper-sync) mirrors the
# user's chosen desktop wallpaper into it, so the login screen tracks the desktop.
# Main.qml falls back to images/background.jpg if this file is missing/unreadable.
background=/var/lib/devos/sddm-wallpaper.jpg
